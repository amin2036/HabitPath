<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anaqia Logo Concepts v3</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Nunito:wght@800;900&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:#f5f3ef; color:#1d1b26; font-family:Poppins,"Hind Siliguri",sans-serif; padding:32px 16px 56px; }
  .wrap { max-width:1180px; margin:0 auto; }
  h1 { text-align:center; font-size:clamp(24px,4vw,34px); font-weight:700; }
  .sub { text-align:center; color:#6d6a78; margin:8px 0 32px; font-family:"Hind Siliguri",sans-serif; font-size:17px; }
  .opt { background:#fff; border-radius:26px; padding:24px; margin-bottom:32px; box-shadow:0 10px 40px rgba(0,0,0,.06); }
  .head { display:flex; align-items:center; gap:12px; margin-bottom:18px; }
  .num { width:38px; height:38px; border-radius:12px; display:grid; place-items:center; color:#fff; font-weight:700; }
  .head h2 { font-size:21px; font-family:"Hind Siliguri",Poppins,sans-serif; }
  .head span { color:#6d6a78; font-size:13.5px; font-family:"Hind Siliguri",Poppins,sans-serif; }
  .row { display:grid; grid-template-columns:1fr 1.5fr; gap:16px; }
  @media (max-width:820px){ .row{grid-template-columns:1fr;} }
  .tile { border-radius:20px; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:8px; padding:28px 16px; min-height:340px; }
  .tile svg.big { width:150px; height:150px; }
  .word { font-size:44px; letter-spacing:-1px; line-height:1; }
  .tag { font-size:9.5px; letter-spacing:4px; text-transform:uppercase; }
  .mini { display:flex; gap:12px; margin-top:14px; align-items:center; }
  .app { width:52px; height:52px; border-radius:15px; display:grid; place-items:center; }
  .site { border-radius:20px; overflow:hidden; border:1px solid rgba(0,0,0,.06); }
  .nav { display:flex; align-items:center; gap:12px; padding:12px 16px; background:#fff; border-bottom:1px solid rgba(0,0,0,.06); }
  .brand { display:flex; align-items:center; gap:8px; font-size:21px; }
  .search { flex:1; background:#f4f4f6; border-radius:999px; padding:8px 14px; font-size:12px; color:#8a8794; font-family:"Hind Siliguri",Poppins; }
  .pill { font-size:11px; border:1px solid rgba(0,0,0,.12); border-radius:999px; padding:4px 10px; }
  @media (max-width:560px){ .search{display:none;} }
  .hero { display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:22px 18px; align-items:center; }
  .hero h3 { font-size:30px; line-height:1.1; font-weight:800; }
  .hero p { color:#6d6a78; font-size:12.5px; margin:10px 0 14px; font-family:"Hind Siliguri",Poppins; }
  .btn { display:inline-block; color:#fff; padding:8px 16px; border-radius:10px; font-weight:600; font-size:12px; }
  .stage { aspect-ratio:1.3; border-radius:16px; display:grid; place-items:center; background:#fff; }
  .stage svg { width:58%; height:auto; }
  .cats { display:flex; gap:8px; padding:0 18px 18px; flex-wrap:wrap; }
  .cat { background:#fff; border-radius:12px; padding:7px 12px; font-size:11px; box-shadow:0 2px 8px rgba(0,0,0,.04); }
  .foot { text-align:center; color:#6d6a78; font-family:"Hind Siliguri",sans-serif; font-size:15px; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute">
  <defs>
    <linearGradient id="or" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFB547"/><stop offset="1" stop-color="#FF6A2B"/></linearGradient>
    <linearGradient id="or2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE2C4"/><stop offset="1" stop-color="#FFC995"/></linearGradient>
    <linearGradient id="tl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#34D399"/><stop offset="1" stop-color="#0E8F8C"/></linearGradient>
    <linearGradient id="bl" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3B82F6"/><stop offset="1" stop-color="#1E3A8A"/></linearGradient>
    <linearGradient id="cy" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#67E8F9"/><stop offset="1" stop-color="#2563EB"/></linearGradient>
    <linearGradient id="co" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FF9E7A"/><stop offset="1" stop-color="#FF4F6D"/></linearGradient>

    <!-- 1. Online storefront A -->
    <g id="s1">
      <rect x="20" y="46" width="80" height="62" rx="14" fill="url(#or2)"/>
      <path d="M16 30 a8 8 0 0 1 8-8 h72 a8 8 0 0 1 8 8 v12 H16z" fill="url(#or)"/>
      <path d="M16 42 a8.6 8.6 0 0 0 17.2 0 a8.6 8.6 0 0 0 17.2 0 a8.6 8.6 0 0 0 17.2 0 a8.6 8.6 0 0 0 17.2 0 a8.6 8.6 0 0 0 17.2 0z" fill="#FF8A3D"/>
      <path d="M33.2 42 a8.6 8.6 0 0 0 17.2 0z M67.6 42 a8.6 8.6 0 0 0 17.2 0z" fill="#fff" opacity=".55"/>
      <path d="M42 106 L60 62 L78 106" fill="none" stroke="url(#or)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M50 91 H70" stroke="#fff" stroke-width="5" stroke-linecap="round"/>
      <circle cx="88" cy="74" r="3" fill="#FF6A2B"/>
    </g>

    <!-- 2. Fast-delivery bag -->
    <g id="s2">
      <path d="M8 56 H24 M4 70 H24 M12 84 H24" stroke="#34D399" stroke-width="5" stroke-linecap="round"/>
      <path d="M50 38 V32 a15 15 0 0 1 30 0 V38" fill="none" stroke="#0E8F8C" stroke-width="6.5" stroke-linecap="round"/>
      <rect x="30" y="36" width="72" height="72" rx="20" fill="url(#tl)"/>
      <text x="66" y="88" text-anchor="middle" font-family="Nunito" font-weight="900" font-size="50" fill="#fff">a</text>
      <circle cx="98" cy="40" r="13" fill="#FFD166"/>
      <path d="M92 40.5 l4 4 8-8.5" fill="none" stroke="#0b3b33" stroke-width="3.4" stroke-linecap="round" stroke-linejoin="round"/>
    </g>

    <!-- 3. Category grid marketplace -->
    <g id="s3">
      <rect x="14" y="14" width="42" height="42" rx="13" fill="url(#bl)"/>
      <path d="M26 28 l6-3 h6 l6 3 l3 5 -4.5 2 v9 h-15 v-9 l-4.5 -2z" fill="#fff"/>
      <circle cx="85" cy="35" r="21" fill="url(#cy)"/>
      <path d="M85 45 c-8-5.6-10.5-9-10.5-12.4 a5 5 0 0 1 10.5-1.8 a5 5 0 0 1 10.5 1.8 c0 3.4-2.5 6.8-10.5 12.4z" fill="#fff"/>
      <rect x="14" y="64" width="42" height="42" rx="13" fill="url(#cy)"/>
      <path d="M25 90 v-4 a10 10 0 0 1 20 0 v4" fill="none" stroke="#fff" stroke-width="3.6" stroke-linecap="round"/>
      <rect x="22.5" y="86" width="6" height="9" rx="2" fill="#fff"/><rect x="41.5" y="86" width="6" height="9" rx="2" fill="#fff"/>
      <path d="M77 72 v-3 a8 8 0 0 1 16 0 v3" fill="none" stroke="#FF4F6D" stroke-width="4.5" stroke-linecap="round"/>
      <rect x="64" y="70" width="42" height="36" rx="12" fill="url(#co)"/>
      <text x="85" y="98" text-anchor="middle" font-family="Poppins" font-weight="700" font-size="27" fill="#fff">a</text>
    </g>
  </defs>
</svg>

<div class="wrap">
  <h1>Anaqia: নতুন রঙে আরও তিনটি লোগো</h1>
  <p class="sub">আপনার দেওয়া লোগো রেফারেন্সের (Shoply, kivo, mallo) মতো প্যাস্টেল ব্যাকগ্রাউন্ড আর নতুন রঙ। প্রতিটি লোগোতে ওয়েবসাইটের ভাবনা আছে, আর ডান পাশে সেই রঙে ওয়েবসাইটের প্রিভিউ।</p>
  <div id="list"></div>
  <p class="foot">পছন্দের লোগোর নম্বর জানান (১, ২ বা ৩)। আগের ডিজাইনের সাথে মিলিয়েও বলতে পারেন।</p>
</div>

<script>
const opts = [
  { id:"s1", t:"অনলাইন স্টোরফ্রন্ট \"A\"", d:"ডোরাকাটা ছাউনিওয়ালা একটি দোকান, যার দরজা \"A\" আকৃতির। ওয়েবসাইটই আপনার অনলাইন দোকান। রঙ: সূর্যাস্ত কমলা, ব্যাকগ্রাউন্ড হালকা পিচ।",
    num:"linear-gradient(135deg,#FFB547,#FF6A2B)", tile:"#FFF1E4", dark:"#2A1608", font:"Poppins", fw:700, ink:"#3A1D0A", tagc:"#B86A35",
    btn:"linear-gradient(135deg,#FFB547,#FF6A2B)", heroBg:"#FFF1E4", accent:"#FF6A2B" },
  { id:"s2", t:"দ্রুত ডেলিভারি ব্যাগ", d:"গতির রেখাসহ ছুটে চলা \"a\" লেখা ব্যাগ আর টিক চিহ্ন। মানে অর্ডার পৌঁছে যায় দ্রুত। রঙ: পান্না-টিল ও সোনালি হলুদ, ব্যাকগ্রাউন্ড মিন্ট।",
    num:"linear-gradient(135deg,#34D399,#0E8F8C)", tile:"#E6F6EF", dark:"#062320", font:"Nunito", fw:900, ink:"#0B3B33", tagc:"#2E8B76",
    btn:"linear-gradient(135deg,#34D399,#0E8F8C)", heroBg:"#E6F6EF", accent:"#0E8F8C" },
  { id:"s3", t:"ক্যাটাগরি গ্রিড মার্কেটপ্লেস", d:"চারটি ঘরে ফ্যাশন, পছন্দ, অডিও আর \"a\" লেখা শপিং ব্যাগ। ওয়েবসাইটের ক্যাটাগরি সেকশনের প্রতিচ্ছবি। রঙ: রয়্যাল ব্লু ও সায়ান, সাথে কোরাল, ব্যাকগ্রাউন্ড আইস ব্লু।",
    num:"linear-gradient(135deg,#3B82F6,#1E3A8A)", tile:"#E9F0FF", dark:"#0A1433", font:"Poppins", fw:600, ink:"#0F1F4A", tagc:"#4B67B0",
    btn:"linear-gradient(135deg,#3B82F6,#1E3A8A)", heroBg:"#E9F0FF", accent:"#FF4F6D" },
];
const ic = (id,s) => `<svg ${s} viewBox="0 0 120 120"><use href="#${id}"/></svg>`;
document.getElementById("list").innerHTML = opts.map((o,i)=>`
<section class="opt">
  <div class="head"><div class="num" style="background:${o.num}">${i+1}</div><div><h2>${o.t}</h2><span>${o.d}</span></div></div>
  <div class="row">
    <div class="tile" style="background:${o.tile}">
      ${ic(o.id,'class="big"')}
      <div class="word" style="font-family:${o.font};font-weight:${o.fw};color:${o.ink}">anaqia</div>
      <div class="tag" style="color:${o.tagc}">Everything You Love</div>
      <div class="mini">
        <div class="app" style="background:#fff;box-shadow:0 4px 14px rgba(0,0,0,.08)">${ic(o.id,'width="38" height="38"')}</div>
        <div class="app" style="background:${o.dark}">${ic(o.id,'width="38" height="38"')}</div>
        <div style="background:${o.dark};border-radius:12px;padding:9px 14px;display:flex;align-items:center;gap:6px;color:#fff;font-family:${o.font};font-weight:${o.fw};font-size:17px">${ic(o.id,'width="24" height="24"')}anaqia</div>
      </div>
    </div>
    <div class="site" style="background:${o.heroBg}">
      <div class="nav">
        <div class="brand" style="font-family:${o.font};font-weight:${o.fw};color:${o.ink}">${ic(o.id,'width="34" height="34"')}<span>anaqia</span></div>
        <div class="search">🔍 পণ্য, ব্র্যান্ড খুঁজুন...</div>
        <span class="pill" style="background:${o.btn};color:#fff;border:0">বাং</span><span class="pill">EN</span><span style="font-size:18px">🛍️</span>
      </div>
      <div class="hero">
        <div>
          <h3 style="color:${o.ink}">Everything<br>You <span style="color:${o.accent}">Love.</span></h3>
          <p>ফ্যাশন, ইলেকট্রনিক্স, বিউটি, হোম, সবকিছু এক জায়গায়। সারা বাংলাদেশে দ্রুত ডেলিভারি।</p>
          <span class="btn" style="background:${o.btn}">Shop Now →</span>
        </div>
        <div class="stage">${ic(o.id,'')}</div>
      </div>
      <div class="cats"><span class="cat">👗 Fashion</span><span class="cat">📱 Electronics</span><span class="cat">💄 Beauty</span><span class="cat">🛋️ Home</span><span class="cat">⚽ Sports</span></div>
    </div>
  </div>
</section>`).join("");
</script>
</body>
</html>
