<!doctype html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Anaqia Color Options</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&family=Hind+Siliguri:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --page:#05060d; --ink:#eef0ff; --muted:#9aa0c3; }
  * { box-sizing:border-box; margin:0; padding:0; }
  body { background:var(--page); color:var(--ink); font-family:Poppins,"Hind Siliguri",sans-serif; padding:32px 16px 64px; }
  .wrap { max-width:1180px; margin:0 auto; }
  header.top { text-align:center; margin-bottom:36px; }
  header.top h1 { font-size:clamp(24px,4vw,36px); font-weight:800; }
  header.top p { color:var(--muted); margin-top:8px; font-family:"Hind Siliguri",sans-serif; font-size:17px; }

  .option { --a:#8B5CF6; --b:#FF5C8A; --bg:#0B0B1E; --bg2:#15153a;
    background:var(--bg); border:1px solid rgba(255,255,255,.08); border-radius:28px;
    padding:28px; margin-bottom:40px; position:relative; overflow:hidden; }
  .option::before { content:""; position:absolute; inset:-40% -10% auto auto; width:520px; height:520px;
    background:radial-gradient(circle, color-mix(in srgb,var(--a) 35%,transparent), transparent 65%); pointer-events:none; }
  .label { display:flex; align-items:center; gap:12px; margin-bottom:22px; position:relative; }
  .num { width:40px; height:40px; border-radius:12px; display:grid; place-items:center; font-weight:800;
    background:linear-gradient(135deg,var(--a),var(--b)); color:#fff; }
  .label h2 { font-size:22px; font-family:"Hind Siliguri",Poppins,sans-serif; }
  .label span { color:var(--muted); font-size:14px; }

  .grid { display:grid; grid-template-columns: 300px 1fr; gap:24px; position:relative; }
  @media (max-width:860px){ .grid { grid-template-columns:1fr; } }

  /* Logo panel */
  .logo-panel { background:linear-gradient(160deg,var(--bg2),var(--bg)); border:1px solid rgba(255,255,255,.08);
    border-radius:22px; padding:28px 20px; display:flex; flex-direction:column; align-items:center; gap:20px; }
  .logo-big svg { width:120px; height:120px; filter:drop-shadow(0 12px 30px color-mix(in srgb,var(--a) 55%,transparent)); }
  .wordmark { text-align:center; }
  .wordmark b { font-size:38px; font-weight:700; letter-spacing:-.5px; }
  .wordmark small { display:block; font-size:10.5px; letter-spacing:4px; text-transform:uppercase; color:var(--muted); margin-top:2px; }
  .light-tile { background:#f6f6fb; border-radius:16px; padding:14px 18px; display:flex; align-items:center; gap:10px; width:100%; justify-content:center; }
  .light-tile svg { width:36px; height:36px; }
  .light-tile b { color:#141428; font-size:22px; font-weight:700; }
  .swatches { display:flex; gap:8px; width:100%; }
  .sw { flex:1; border-radius:12px; height:54px; display:flex; align-items:flex-end; padding:6px; font-size:10px; font-weight:600; color:#fff; text-shadow:0 1px 2px rgba(0,0,0,.5); }

  /* Mini homepage */
  .site { background:var(--bg); border:1px solid rgba(255,255,255,.1); border-radius:22px; overflow:hidden; }
  .nav { display:flex; align-items:center; gap:14px; padding:14px 18px; border-bottom:1px solid rgba(255,255,255,.07); background:rgba(255,255,255,.02); }
  .nav .brand { display:flex; align-items:center; gap:8px; font-weight:700; font-size:19px; }
  .nav .brand svg { width:30px; height:30px; }
  .search { flex:1; background:rgba(255,255,255,.06); border:1px solid rgba(255,255,255,.1); border-radius:999px; padding:8px 14px; font-size:12.5px; color:var(--muted); }
  .lang { font-size:12px; border:1px solid rgba(255,255,255,.15); border-radius:999px; overflow:hidden; display:flex; }
  .lang i { font-style:normal; padding:5px 10px; }
  .lang i:first-child { background:linear-gradient(135deg,var(--a),var(--b)); color:#fff; }
  .cart { position:relative; font-size:18px; }
  .cart em { position:absolute; top:-6px; right:-8px; background:var(--b); color:#fff; font-style:normal; font-size:10px; border-radius:999px; padding:1px 5px; }
  @media (max-width:560px){ .search{display:none;} }

  .hero { display:grid; grid-template-columns:1.1fr 1fr; gap:16px; padding:28px 22px; align-items:center; }
  @media (max-width:640px){ .hero{grid-template-columns:1fr;} }
  .hero h3 { font-size:clamp(26px,3.4vw,38px); line-height:1.1; font-weight:800; }
  .grad { background:linear-gradient(90deg,var(--a),var(--b)); -webkit-background-clip:text; background-clip:text; color:transparent; }
  .hero p { color:var(--muted); font-size:13.5px; margin:12px 0 18px; font-family:"Hind Siliguri",Poppins,sans-serif; }
  .btn { display:inline-block; background:linear-gradient(135deg,var(--a),var(--b)); color:#fff; padding:10px 20px; border-radius:12px; font-weight:600; font-size:13px;
    box-shadow:0 10px 28px color-mix(in srgb,var(--b) 40%,transparent); }
  .btn.ghost { background:transparent; border:1px solid rgba(255,255,255,.2); box-shadow:none; margin-left:8px; }
  .orb { aspect-ratio:1.25; border-radius:20px; position:relative; overflow:hidden;
    background:radial-gradient(circle at 50% 85%, color-mix(in srgb,var(--a) 70%,transparent), transparent 55%), linear-gradient(160deg,var(--bg2),var(--bg)); border:1px solid rgba(255,255,255,.08); }
  .ring { position:absolute; left:50%; bottom:10%; width:70%; height:18%; transform:translateX(-50%); border-radius:50%;
    border:2px solid var(--a); box-shadow:0 0 24px var(--a), inset 0 0 18px var(--b); }
  .float { position:absolute; background:rgba(255,255,255,.07); backdrop-filter:blur(6px); border:1px solid color-mix(in srgb,var(--a) 50%,transparent);
    border-radius:14px; padding:8px 10px; font-size:24px; display:flex; flex-direction:column; align-items:center; box-shadow:0 0 18px color-mix(in srgb,var(--a) 30%,transparent); }
  .float small { font-size:9px; color:var(--ink); margin-top:2px; }

  .cats { display:flex; gap:10px; padding:0 22px 20px; overflow-x:auto; }
  .cat { flex:0 0 auto; background:rgba(255,255,255,.05); border:1px solid rgba(255,255,255,.08); border-radius:14px; padding:10px 14px; text-align:center; font-size:11px; }
  .cat div { font-size:22px; margin-bottom:4px; }

  .products { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:0 22px 24px; }
  @media (max-width:640px){ .products{grid-template-columns:repeat(2,1fr);} }
  .card { background:rgba(255,255,255,.04); border:1px solid rgba(255,255,255,.08); border-radius:16px; padding:10px; }
  .card .img { aspect-ratio:1.1; border-radius:12px; display:grid; place-items:center; font-size:38px; position:relative;
    background:linear-gradient(160deg, color-mix(in srgb,var(--a) 22%,var(--bg2)), var(--bg2)); }
  .card .tag { position:absolute; top:6px; left:6px; background:var(--b); color:#fff; font-size:9.5px; font-weight:700; border-radius:6px; padding:2px 6px; }
  .card h4 { font-size:12px; font-weight:500; margin:8px 0 4px; }
  .card .price { display:flex; align-items:baseline; gap:6px; }
  .card .price b { font-size:14px; color:color-mix(in srgb,var(--a) 60%,#fff); }
  .card .price s { font-size:10.5px; color:var(--muted); }
  .card .star { font-size:10.5px; color:#fbbf24; }

  .pick { margin-top:18px; color:var(--muted); font-size:14px; text-align:center; font-family:"Hind Siliguri",sans-serif; position:relative; }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <h1>Anaqia: চারটি রঙের অপশন</h1>
    <p>প্রতিটি অপশনে লোগো (ডার্ক ও লাইট ব্যাকগ্রাউন্ডে), রঙের প্যালেট আর হোমপেজের ছোট প্রিভিউ দেখানো হয়েছে</p>
  </header>
  <div id="options"></div>
</div>

<template id="logo-tpl">
  <svg viewBox="0 0 64 64" xmlns="http://www.w3.org/2000/svg" aria-label="Anaqia logo">
    <defs>
      <linearGradient id="G" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="A"/><stop offset="1" stop-color="B"/>
      </linearGradient>
    </defs>
    <path d="M23 22v-5a9 9 0 0 1 18 0v5" fill="none" stroke="url(#G)" stroke-width="4.2" stroke-linecap="round"/>
    <rect x="9" y="21" width="46" height="38" rx="13" fill="url(#G)"/>
    <path d="M23.5 51 32 31.5 40.5 51" fill="none" stroke="#fff" stroke-width="4.6" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M27.2 44.2h9.6" stroke="#fff" stroke-width="4" stroke-linecap="round"/>
    <path d="M50 6l1.6 4.4L56 12l-4.4 1.6L50 18l-1.6-4.4L44 12l4.4-1.6z" fill="B"/>
  </svg>
</template>

<script>
const options = [
  { n:1, name:"বেগুনি + গোলাপি গ্রেডিয়েন্ট", en:"Neon Purple × Coral Pink", a:"#8B5CF6", b:"#FF5C8A", bg:"#0B0B1E", bg2:"#17163d" },
  { n:2, name:"সায়ান + নীল গ্রেডিয়েন্ট", en:"Electric Cyan × Deep Blue", a:"#22D3EE", b:"#3B5BFF", bg:"#06101F", bg2:"#0d2140" },
  { n:3, name:"সোনালি + বেগুনি", en:"Royal Gold × Purple", a:"#F5C451", b:"#7C3AED", bg:"#120A1F", bg2:"#251640" },
  { n:4, name:"পান্না সবুজ + টিল", en:"Emerald × Teal", a:"#10B981", b:"#06B6D4", bg:"#061412", bg2:"#0c2a26" },
];
const tpl = document.getElementById("logo-tpl").innerHTML;
const logo = (o,k) => tpl.replaceAll('"A"',`"${o.a}"`).replaceAll('"B"',`"${o.b}"`).replaceAll('id="G"',`id="g${o.n}${k}"`).replaceAll("url(#G)",`url(#g${o.n}${k})`);
const products = [
  ["🎧","Wireless Headphones","৳4,990","৳6,500","-23%"],
  ["⌚","Smart Watch Pro","৳7,450","৳9,900","-25%"],
  ["👟","Street Sneakers","৳3,290","৳4,200","-22%"],
  ["🧴","Glow Serum","৳1,150","৳1,600","-28%"],
];
const cats = [["👗","Fashion"],["📱","Electronics"],["💄","Beauty"],["🛋️","Home"],["⚽","Sports"],["🧸","Kids"],["🛒","Grocery"]];

document.getElementById("options").innerHTML = options.map(o => `
<section class="option" style="--a:${o.a};--b:${o.b};--bg:${o.bg};--bg2:${o.bg2}">
  <div class="label"><div class="num">${o.n}</div><div><h2>${o.name}</h2><span>${o.en}</span></div></div>
  <div class="grid">
    <div class="logo-panel">
      <div class="logo-big">${logo(o,"a")}</div>
      <div class="wordmark"><b>anaqia</b><small>Everything You Love</small></div>
      <div class="light-tile">${logo(o,"b")}<b>anaqia</b></div>
      <div class="swatches">
        <div class="sw" style="background:${o.a}">${o.a}</div>
        <div class="sw" style="background:${o.b}">${o.b}</div>
        <div class="sw" style="background:${o.bg2};border:1px solid rgba(255,255,255,.15)">${o.bg}</div>
      </div>
    </div>
    <div class="site">
      <div class="nav">
        <div class="brand">${logo(o,"c")}anaqia</div>
        <div class="search">🔍 পণ্য, ব্র্যান্ড খুঁজুন...</div>
        <div class="lang"><i>বাং</i><i>EN</i></div>
        <div class="cart">🛍️<em>3</em></div>
      </div>
      <div class="hero">
        <div>
          <h3>Everything<br>You <span class="grad">Love.</span></h3>
          <p>ফ্যাশন, ইলেকট্রনিক্স, বিউটি থেকে হোম পর্যন্ত, সবকিছু এক জায়গায়। দ্রুত ডেলিভারি সারা বাংলাদেশে।</p>
          <span class="btn">Shop Now →</span><span class="btn ghost">Deals</span>
        </div>
        <div class="orb">
          <div class="ring"></div>
          <div class="float" style="left:8%;top:12%">👗<small>Fashion</small></div>
          <div class="float" style="right:8%;top:8%">🎧<small>Audio</small></div>
          <div class="float" style="left:38%;top:30%">⌚<small>Tech</small></div>
          <div class="float" style="right:12%;top:48%">🧴<small>Beauty</small></div>
          <div class="float" style="left:12%;top:52%">🛋️<small>Home</small></div>
        </div>
      </div>
      <div class="cats">${cats.map(c=>`<div class="cat"><div>${c[0]}</div>${c[1]}</div>`).join("")}</div>
      <div class="products">${products.map(p=>`
        <div class="card"><div class="img"><span class="tag">${p[4]}</span>${p[0]}</div>
          <h4>${p[1]}</h4><div class="star">★★★★★ <span style="color:#9aa0c3">4.8</span></div>
          <div class="price"><b>${p[2]}</b><s>${p[3]}</s></div></div>`).join("")}
      </div>
    </div>
  </div>
</section>`).join("") + `<p class="pick">পছন্দের অপশনের নম্বর জানান (১, ২, ৩ বা ৪), অথবা কোনো পরিবর্তন চাইলে বলুন।</p>`;
</script>
</body>
</html>
